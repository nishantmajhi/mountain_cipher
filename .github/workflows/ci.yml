name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libargon2-dev
      # Unit tests, then the two binaries end to end. Most of the time goes
      # on Argon2id at 64 MiB, which the suite derives a key with about
      # ninety times.
      - run: make test
